# =============================================================================
# reusable-build.yml —— Qt 编译核心复用工作流
#
# 由 qt5-modern.yml / qt6-modern.yml / qt5-legacy.yml 通过 workflow_call 调用。
# 不直接暴露给用户，避免参数面板分散。
#
# 职责：
#   1. 校验参数组合合法性（含风险警告）
#   2. 打印编译机器硬件资源
#   3. 安装系统依赖
#   4. 下载并解包 Qt 源码（含缓存）
#   5. 生成 configure 参数
#   6. configure + build + install
#   7. 精简 + 打包 + 校验
#   8. 上传 artifact 并发布到 Release
# =============================================================================
name: Reusable Qt Build

on:
  workflow_call:
    inputs:
      qt_major:
        description: "Qt 大版本 (5 或 6)"
        required: true
        type: string
      qt_version:
        description: "Qt 版本号，例如 5.15.17 / 6.8.3"
        required: true
        type: string
      os:
        description: "目标系统: linux / windows / macos"
        required: true
        type: string
      compiler:
        description: "编译器: gcc / clang / msvc2022 / msvc2019 / mingw / devtoolset"
        required: true
        type: string
      arch:
        description: "目标架构: x86_64 / arm64"
        required: false
        type: string
        default: "x86_64"
      build_type:
        description: "构建类型: release / debug / debug-and-release"
        required: false
        type: string
        default: "release"
      source_package:
        description: "源码包: qtbase / qt-everywhere"
        required: false
        type: string
        default: "qtbase"
      static_build:
        description: "是否静态构建"
        required: false
        type: boolean
        default: false
      skip_modules:
        description: "跳过的模块，逗号分隔"
        # qtlocation 默认跳过：依赖 mapbox-gl-native（重型第三方），编译极慢且常失败
        required: false
        type: string
        default: "qtdoc,qt3d,qtwebengine,qtwebview,qtlocation"
      extra_configure_args:
        description: "追加的 configure 参数"
        required: false
        type: string
        default: ""
      openssl_linked:
        description: "是否 -openssl-linked"
        required: false
        type: boolean
        default: true
      sql_drivers:
        description: "需要的 SQL 驱动，逗号分隔，如 psql,oci"
        required: false
        type: string
        default: ""
      use_ccache:
        description: "是否启用 ccache 加速"
        required: false
        type: boolean
        default: true
      linux_flavor:
        description: "Linux 线: legacy(老系统/glibc2.17) / modern(新系统) / auto"
        required: false
        type: string
        default: "auto"
      enable_wayland:
        description: "是否启用 Wayland 支持（Linux modern 线）"
        required: false
        type: boolean
        default: true
      use_system_png:
        description: "Linux: true=系统 libpng(-system-libpng)；false=内置(-qt-libpng)"
        required: false
        type: boolean
        default: true
      pack_mode:
        description: "打包模式: dev-lite（剔除 doc/examples 源码，保留全部开发文件）/ dev-full（原样打包）"
        required: false
        type: string
        default: "dev-lite"
      create_release:
        description: "是否创建/更新 GitHub Release"
        required: false
        type: boolean
        default: true
      release_tag:
        description: "Release tag（留空自动生成）"
        required: false
        type: string
        default: ""
      prerelease:
        description: "是否标记为预发布"
        required: false
        type: boolean
        default: false
      use_container:
        description: "是否在容器内构建（老系统兼容场景）"
        required: false
        type: boolean
        default: false
      container_image:
        description: "容器镜像（老系统线，glibc 2.28）"
        required: false
        type: string
        default: "almalinux:8"
      devtoolset:
        description: "GCC toolset 版本（容器内用），例如 gcc-toolset-11"
        required: false
        type: string
        default: "gcc-toolset-11"
      timeout_minutes:
        description: "单 job 超时时间（分钟），留 10 分钟余量给上传"
        required: false
        type: number
        default: 350

    outputs:
      artifact_name:
        description: "产物名称"
        value: ${{ jobs.build.outputs.artifact_name }}
      build_seconds:
        description: "编译耗时（秒）"
        value: ${{ jobs.build.outputs.build_seconds }}

# -----------------------------------------------------------------------------
permissions:
  contents: write

jobs:
  build:
    name: Qt${{ inputs.qt_major }} ${{ inputs.qt_version }} / ${{ inputs.os }}-${{ inputs.compiler }}
    runs-on: ${{ inputs.os == 'linux' && 'ubuntu-22.04' || (inputs.os == 'windows' && 'windows-2022' || (inputs.arch == 'arm64' && 'macos-14' || 'macos-13')) }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    container: ${{ inputs.use_container && inputs.container_image || null }}

    concurrency:
      group: qt-build-${{ inputs.qt_major }}-${{ inputs.qt_version }}-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build_type }}
      cancel-in-progress: false

    env:
      QT_MAJOR: ${{ inputs.qt_major }}
      QT_VERSION: ${{ inputs.qt_version }}
      QT_PLATFORM: ${{ inputs.os }}-${{ inputs.compiler }}
      QT_ARCH: ${{ inputs.arch }}
      QT_BUILD_TYPE: ${{ inputs.build_type }}
      QT_SOURCE_PACKAGE: ${{ inputs.source_package }}
      QT_STATIC: ${{ inputs.static_build }}
      QT_SKIP_MODULES: ${{ inputs.skip_modules }}
      QT_EXTRA_ARGS: ${{ inputs.extra_configure_args }}
      QT_OPENSSL_LINKED: ${{ inputs.openssl_linked }}
      QT_SQL_DRIVERS: ${{ inputs.sql_drivers }}
      QT_USE_CCACHE: ${{ inputs.use_ccache }}
      QT_PACK_MODE: ${{ inputs.pack_mode }}
      QT_LINUX_FLAVOR: ${{ inputs.linux_flavor }}
      QT_ENABLE_WAYLAND: ${{ inputs.enable_wayland }}
      QT_USE_SYSTEM_PNG: ${{ inputs.use_system_png }}
      IS_WINDOWS: ${{ inputs.os == 'windows' }}
      IS_MACOS: ${{ inputs.os == 'macos' }}
      IS_LINUX: ${{ inputs.os == 'linux' }}

    outputs:
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      build_seconds: ${{ steps.build.outputs.build_seconds || '0' }}

    steps:
      # =======================================================================
      # 0. 参数校验 + 风险警告
      # =======================================================================
      - name: 参数校验与风险提示
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::参数校验"
          echo "  Qt 版本    : ${{ inputs.qt_version }}"
          echo "  目标系统   : ${{ inputs.os }}"
          echo "  编译器     : ${{ inputs.compiler }}"
          echo "  架构       : ${{ inputs.arch }}"
          echo "  构建类型   : ${{ inputs.build_type }}"
          echo "  源码粒度   : ${{ inputs.source_package }}"
          echo "  静态构建   : ${{ inputs.static_build }}"
          echo "  跳过模块   : ${{ inputs.skip_modules }}"
          echo "  打包模式   : ${{ inputs.pack_mode }}"
          echo "::endgroup::"

          WARN=0

          # ---- 高风险组合检查 ----
          if [[ "${{ inputs.source_package }}" == "qt-everywhere" ]]; then
            echo "::warning title=编译时长风险::选择了 qt-everywhere 完整源码包。即使在 4 核 runner 上，Linux/macOS 约需 2-4 小时，Windows 约需 2-5 小时，且有较大概率触发 6 小时 job 上限而被强制中断。建议优先使用 qtbase。"
            WARN=$((WARN+1))
          fi

          if [[ "${{ inputs.build_type }}" == "debug" || "${{ inputs.build_type }}" == "debug-and-release" ]]; then
            echo "::warning title=编译时长与体积风险::选择了 ${{ inputs.build_type }} 构建。Debug 构建耗时约为 Release 的 2-3 倍，产物体积可达 3-5 倍，极大概率超过 GitHub Release 单资产 2GB 上限。建议仅在必要时使用。"
            WARN=$((WARN+1))
          fi

          if [[ "${{ inputs.build_type }}" == "debug-and-release" && "${{ inputs.qt_major }}" == "6" ]]; then
            echo "::warning title=参数不兼容::Qt6 已取消 debug-and-release 组合参数，将自动回退为 release。"
            WARN=$((WARN+1))
          fi

          if [[ "${{ inputs.static_build }}" == "true" ]]; then
            echo "::warning title=许可与体积提示::静态构建会显著增大产物体积，且需注意 LGPL 合规要求。"
            WARN=$((WARN+1))
          fi

          if [[ "${{ inputs.pack_mode }}" == "dev-full" || "${{ inputs.pack_mode }}" == "full" ]]; then
            echo "::warning title=产物体积风险::选择了 dev-full 原样打包（含 doc/examples），产物可能超过 2GB 单资产上限。若超限，Release 上传步骤会失败。"
            WARN=$((WARN+1))
          fi

          # ---- Linux 线一致性检查 ----
          if [[ "${{ inputs.os }}" == "linux" ]]; then
            if [[ "${{ inputs.use_container }}" == "true" && "${{ inputs.enable_wayland }}" == "true" ]]; then
              echo "::warning title=Wayland 保持关闭::老系统（glibc 2.28 基线）线固定关闭 Wayland，以保证产物在无 Wayland 的服务器/国产系统上稳定。将强制关闭。"
              WARN=$((WARN+1))
            fi
            if [[ "${{ inputs.use_container }}" == "true" && "${{ inputs.use_system_png }}" == "true" ]]; then
              echo "::warning title=libpng 版本风险::老系统线为最大兼容性使用内置 libpng（use_system_png=false / -qt-libpng）。将自动回退为内置。"
              WARN=$((WARN+1))
            fi
            if [[ "${{ inputs.qt_major }}" == "6" && "${{ inputs.use_container }}" == "true" ]]; then
              echo "::error title=暂不支持::Qt6 老系统线尚未启用（需配 gcc-toolset 且版本组合需单独验证）。本线目前只支持 Qt5。"
            fi
          fi

          # 高危组合：everywhere + debug = 几乎必然失败
          if [[ "${{ inputs.source_package }}" == "qt-everywhere" && ( "${{ inputs.build_type }}" == "debug" || "${{ inputs.build_type }}" == "debug-and-release" ) ]]; then
            echo "::error title=高危组合::qt-everywhere + Debug 构建组合耗时预计超过 6 小时，几乎必然失败。强烈建议改为 qtbase，或改用 release。"
          fi

          echo ""
          if (( WARN > 0 )); then
            echo "================================================================"
            echo " 已触发 ${WARN} 项风险警告，请回看上方 ::warning 提示"
            echo " 本工作流仍会继续执行，但请做好失败与超时的心理准备"
            echo "================================================================"
          else
            echo "参数校验通过，未发现明显风险组合。"
          fi

      - name: 容器基础准备 (老系统线)
        if: ${{ inputs.use_container }}
        shell: bash
        run: |
          set -euo pipefail
          # 基础镜像：AlmaLinux 8（glibc 2.28）。
          #   为何不用 CentOS7：CentOS7 是 glibc 2.17，而 GitHub Actions 自带的
          #   Node.js（v20/v24，/__e/nodeXX/bin/node）要求 glibc >= 2.27/2.28，
          #   导致 actions/checkout、actions/cache、actions/upload-artifact 等所有
          #   Node-based action 在 CentOS7 容器内直接起不来（CXXABI/GLIBC not found）。
          #   AlmaLinux 8 有 glibc 2.28，既能跑这些 action，产物兼容面又远宽于
          #   Ubuntu 22.04（2.35），覆盖 Debian10+/Ubuntu18.10+/RHEL8+。
          echo "::group::系统信息"
          # 注意：不要用 `... | head -N`。在 `set -o pipefail` 下，上游命令
          # （cat / dnf ...）在 head 提前关管道后会收到 SIGPIPE，退出码 141
          # （128+13），pipefail 会把整个管道判为失败，导致步骤莫名报 141。
          # 这里用 grep -m N 限流，或把 head 放在最后并显式 || true。
          { grep -m3 -E '^(NAME|VERSION|ID)=' /etc/os-release || true; }
          { ldd --version 2>/dev/null | head -n1 || true; }
          echo "::endgroup::"

          echo "::group::安装容器基础工具"
          # AlmaLinux 8 官方源仍在线（EOL 2029），无需切 vault
          dnf install -y --setopt=install_weak_deps=False \
            git which tar xz wget ca-certificates dnf-plugins-core
          echo "::endgroup::"

      # =======================================================================
      # 1. 检出仓库（需要脚本文件）
      # =======================================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =======================================================================
      # 2. 打印编译机器硬件资源
      # =======================================================================
      - name: 打印编译主机硬件信息 (Linux/macOS/容器)
        if: inputs.os != 'windows'
        shell: bash
        run: |
          mkdir -p host-info
          bash .github/scripts/print-host-info.sh host-info/host-info.txt

      - name: 激活 MSVC 环境 (Windows)
        if: ${{ inputs.os == 'windows' && startsWith(inputs.compiler, 'msvc') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ inputs.arch == 'arm64' && 'arm64' || 'x64' }}
          toolset: ${{ inputs.compiler == 'msvc2019' && '14.29' || '' }}

      - name: 打印编译主机硬件信息 (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path host-info | Out-Null
          pwsh -NoProfile -File .github/scripts/print-host-info.ps1 -OutFile host-info/host-info.txt

      # =======================================================================
      # 3. 安装系统依赖
      # =======================================================================
      - name: 安装依赖 (Ubuntu)
        if: ${{ inputs.os == 'linux' && !inputs.use_container }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::apt install"

          # GitHub 的 ubuntu-24.04 runner 默认只启用 main/restricted。
          # 而 glslc（Vulkan shader 编译器，Source: shaderc）、spirv-* 等均位于
          # universe 源 → 不显式启用会报 "Unable to locate package glslc"。
          sudo add-apt-repository -y universe
          sudo apt-get update -qq

          # ---------------------------------------------------------------
          # 必需依赖：缺失会直接导致 configure 失败
          # ---------------------------------------------------------------
          # 注意 libclang-dev（见下方「悬空 ClangConfig」说明）：
          #   GitHub 的 ubuntu-22.04 镜像**预装**了 clang-14 编译器，并随之
          #   提供了 /usr/lib/cmake/clang-14/ClangConfig.cmake 与
          #   /usr/lib/llvm-14/lib/cmake/clang/ClangTargets.cmake，
          #   但**不含**这些 config 所引用的静态库（libclangBasic.a 等）。
          #   Qt6 的 qttools/configure.cmake 会 `qt_find_package(WrapLibClang 8)`
          #   （注意：非 MARK_OPTIONAL），其内部 `find_package(Clang CONFIG)`
          #   一旦命中上面的 ClangConfig.cmake，就会 include ClangTargets.cmake
          #   并在「imported target clangBasic 引用的文件不存在」处 **FATAL_ERROR**，
          #   直接把 configure 打死（run 38329189861 即此原因）。
          #   这是 Ubuntu/GitHub runner 的经典陷阱：config 在、库不在，二者不配套。
          #   修法（Qt 官方文档推荐的解法）：补装 libclang-dev，让被引用的库落地。
          #   用不带版本号的 meta 包，自动跟随镜像里的 clang 版本，避免写死 -14。
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache perl python3 \
            libclang-dev \
            libgl1-mesa-dev libglu1-mesa-dev libegl1-mesa-dev \
            libx11-dev libx11-xcb-dev libxext-dev libxfixes-dev libxi-dev \
            libxrender-dev libxcb1-dev 'libxcb*-dev' libxcb-xkb-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xinput-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev libdbus-1-dev \
            libwayland-dev libwayland-egl-backend-dev \
            libpq-dev zlib1g-dev libpng-dev \
            pkg-config bison flex gperf \
            libpcre2-dev libsqlite3-dev
          echo "::endgroup::"

          # ---------------------------------------------------------------
          # 自检：确认 libclang 的 CMake config 与静态库「配套」
          #   光装 libclang-dev 还不够保险 —— 若镜像日后把 clang 主版本抬到 15/16
          #   而 ClangConfig.cmake 仍指向旧路径，同样的悬空错误会重现。
          #   这里主动校验：凡找到的 ClangTargets.cmake，其 libclangBasic 必须真实存在。
          #
          #   ⚠ 不要去「猜」路径（dirname 上溯 N 层很容易算错，两种布局层数不同）。
          #   直接读文件里 CMake 自己写的 _IMPORT_PREFIX —— 这是 CMake 生成时
          #   记录的真实前缀，等价于 configure 时的判定，绝不会与 CMake 不一致。
          #   ClangTargets.cmake 头部形如：
          #     set(_IMPORT_PREFIX ".../lib/cmake/clang")
          #     get_filename_component(_IMPORT_PREFIX "${_IMPORT_PREFIX}" PATH)  # ×3
          #   3 次上溯后 _IMPORT_PREFIX = <前缀>，库在 <前缀>/lib/libclangBasic.a
          #   （其中第一次 get_filename_component 是去掉文件名本身，后 2 次数"目录层"，
          #    连同最后一次 PATH 共 3 行——故从文件所在目录再上溯 3 层即得前缀。）
          #
          #   只报警不阻塞：缺了顶多 qdoc/clangcpp 关闭，Qt 主体不受影响。
          # ---------------------------------------------------------------
          echo "::group::自检 libclang CMake config 一致性"
          found_any=0
          shopt -s nullglob
          roots=(/usr/lib/cmake)
          for d in /usr/lib/llvm-*; do
            [[ -d "$d" ]] && roots+=("$d")
          done
          shopt -u nullglob
          while IFS= read -r tgt; do
            found_any=1
            # 从文件里抽 _IMPORT_PREFIX 的初始值（第一条 set(...)），再按 CMake 的
            # 规则上溯 3 层；若抽不到就退回"文件所在目录上溯 3 层"。
            base="$(sed -n 's/^[[:space:]]*set(_IMPORT_PREFIX[[:space:]]*"\(.*\)").*/\1/p' "$tgt" | grep -m1 . || true)"
            if [[ -z "$base" ]]; then base="$(dirname "$tgt")"; fi
            prefix="$base"; for _ in 1 2 3; do prefix="$(dirname "$prefix")"; done
            if [[ -f "$prefix/lib/libclangBasic.a" ]]; then
              echo "[OK] libclang config 与静态库配套: $tgt (prefix=$prefix)"
            else
              echo "::warning title=libclang 配置悬空::$tgt 期望的 $prefix/lib/libclangBasic.a 不存在，"\
          "configure 可能在 qttools 处 FATAL_ERROR"
            fi
          done < <(find "${roots[@]}" -name ClangTargets.cmake 2>/dev/null)
          if [[ $found_any -eq 0 ]]; then
            echo "未发现 ClangTargets.cmake —— qttools 会直接跳过 libclang（仅告警，不致命）"
          fi
          echo "::endgroup::"

          # ---------------------------------------------------------------
          # 可选依赖：Vulkan / SPIR-V 工具链
          #   Qt 的 vulkan feature 条件是 WrapVulkanHeaders_FOUND，且
          #   qt_find_package(WrapVulkanHeaders ... MARK_OPTIONAL) —— 属于
          #   「可选」而非硬需求，缺失只会让 vulkan feature 关闭（并连带
          #   vkkhrdisplay 平台插件），不会让 configure 失败。
          #   因此这里单独安装且**失败不阻塞**，避免上游仓库再变动时
          #   又把整条构建线拖死。
          #   注：glslc / spirv-* 来自 universe 源（Source: shaderc）。
          # ---------------------------------------------------------------
          echo "::group::apt install (可选: Vulkan)"
          if sudo apt-get install -y --no-install-recommends \
               libvulkan-dev glslc spirv-headers spirv-tools 2>/dev/null; then
            echo "Vulkan / SPIR-V 工具链已安装，vulkan feature 可启用"
          else
            echo "::warning title=可选依赖缺失::Vulkan/SPIR-V 工具链未能安装，"\
          "本次构建将关闭 vulkan feature（不影响 Qt 主体功能）"
          fi
          echo "::endgroup::"

          # 按需安装指定版本的 gcc / clang
          case "${{ inputs.compiler }}" in
            gcc)
              echo "使用系统默认 gcc: $(gcc --version | head -n1)";;
            clang)
              sudo apt-get install -y clang lld
              echo "clang: $(clang --version | head -n1)";;
          esac

      - name: 安装依赖 (老系统容器)
        if: ${{ inputs.use_container }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::dnf install (AlmaLinux 8 + gcc-toolset)"
          # AlmaLinux 8 用 dnf；gcc-toolset 等价于 CentOS7 的 devtoolset，
          # 通过 scl enable 激活（与原来一致的用法）。
          #
          # 先确保 CodeReady/powertools 仓库可用：libdbusmenu-devel、
          # libxkbcommon-x11-devel、libXcomposite-devel 等只在 CRB/PowerTools 里。
          # 不同小版本仓库名有差异（powertools / crb），两个都试，缺一不阻塞。
          dnf install -y --setopt=install_weak_deps=False dnf-plugins-core >/dev/null 2>&1 || true
          dnf config-manager --set-enabled powertools >/dev/null 2>&1 || \
            dnf config-manager --set-enabled crb >/dev/null 2>&1 || true
          # EPEL 提供 libdbusmenu-devel 等少量包；装不上也继续（下方按需提示）
          dnf install -y --setopt=install_weak_deps=False epel-release >/dev/null 2>&1 || true

          dnf install -y --setopt=install_weak_deps=False \
            "${{ inputs.devtoolset }}" \
            make cmake ninja-build perl python3 which \
            mesa-libGL-devel mesa-libEGL-devel \
            libxcb-devel xcb-util-devel xcb-util-image-devel xcb-util-keysyms-devel \
            xcb-util-renderutil-devel xcb-util-wm-devel \
            libX11-devel libXrender-devel libXi-devel libXext-devel \
            libXfixes-devel libXrandr-devel libXcursor-devel libXinerama-devel \
            libXcomposite-devel libdrm-devel \
            libxkbcommon-devel libxkbcommon-x11-devel \
            fontconfig-devel libffi-devel sqlite-devel \
            bison flex pcre2-devel openssl-devel \
            postgresql-devel \
            libdbusmenu-devel
          echo "toolset: ${{ inputs.devtoolset }} 安装完成"
          echo ""

          # Wayland 依赖：AlmaLinux 8 的 AppStream 里有 libwayland-devel。
          # 本线固定关闭 Wayland，但预装以便将来开启时不改流水线；装失败不阻塞。
          if dnf install -y --setopt=install_weak_deps=False \
               libwayland-client-devel libwayland-server-devel 2>/dev/null; then
            echo "（可选）libwayland-devel 已就绪（本线暂未启用 Wayland）"
          else
            echo "（可选）libwayland-devel 未安装，不影响本线（Wayland 固定关闭）"
          fi
          echo "::endgroup::"

      - name: 安装依赖 (macOS)
        if: inputs.os == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          brew install ccache ninja pkg-config libpq 2>/dev/null || true
          # Qt5/macOS 常见依赖
          brew install freetype fontconfig 2>/dev/null || true

      - name: 安装依赖 (Windows)
        if: inputs.os == 'windows'
        shell: pwsh
        run: |
          Write-Host "编译器环境:"
          Get-Command cl.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (Get-Command cl.exe -ErrorAction SilentlyContinue) { cl 2>&1 | Select-Object -First 2 }
          # ccache / ninja（choco 已预装在 windows-2022 上，失败也不阻塞）
          choco install ccache ninja -y --no-progress 2>$null | Out-Null
          if (Get-Command ccache -ErrorAction SilentlyContinue) { ccache --version | Select-Object -First 1 } else { Write-Host "ccache 未安装（可选）" }

      # =======================================================================
      # 4. 下载并解包 Qt 源码（带缓存）
      # =======================================================================
      - name: 确定源码 URL
        id: src
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ inputs.qt_version }}"
          # 主次版本，例如 5.15.17 -> 5.15
          MM=$(echo "$VER" | cut -d. -f1,2)

          # ------------------------------------------------------------------
          # 源码包命名规则（经验证，各版本命名不统一，需分支处理）：
          #
          #   qt-everywhere（完整包）    -> single/  目录
          #     5.15.3+ : qt-everywhere-opensource-src-<VER>.tar.xz
          #     <=5.15.2: qt-everywhere-src-<VER>.tar.xz   （无 opensource）
          #
          #   qtbase（仅核心库）          -> submodules/ 目录
          #     Qt6     : qtbase-everywhere-src-<VER>.tar.xz
          #     Qt5.15.16+ : qtbase-everywhere-opensource-src-<VER>.tar.xz
          #     Qt5 更早 : 可能不存在，需回退到 everywhere 后只编 qtbase 子目录
          # ------------------------------------------------------------------
          CANDIDATES=()

          if [[ "${{ inputs.source_package }}" == "qtbase" ]]; then
            # 命名不统一：Qt6 无 opensource；Qt5.15.16+ 带 opensource；Qt5 早期又不带
            for STYLE in "qtbase-everywhere-src" "qtbase-everywhere-opensource-src"; do
              FILE="${STYLE}-${VER}.tar.xz"
              for M in "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt" \
                       "https://mirrors.ustc.edu.cn/qtproject/archive/qt" \
                       "https://mirrors.aliyun.com/qt/archive/qt" \
                       "https://download.qt.io/archive/qt"; do
                CANDIDATES+=("${M}/${MM}/${VER}/submodules/${FILE}")
              done
            done
          else
            # 两套命名都试
            for STYLE in "qt-everywhere-opensource-src" "qt-everywhere-src"; do
              FILE="${STYLE}-${VER}.tar.xz"
              for M in "https://mirrors.tuna.tsinghua.edu.cn/qt/archive/qt" \
                       "https://mirrors.ustc.edu.cn/qtproject/archive/qt" \
                       "https://mirrors.aliyun.com/qt/archive/qt" \
                       "https://download.qt.io/archive/qt"; do
                CANDIDATES+=("${M}/${MM}/${VER}/single/${FILE}")
              done
            done
          fi


          {
            echo "urls<<EOF"
            for u in "${CANDIDATES[@]}"; do echo "$u"; done
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "候选下载地址:"
          for u in "${CANDIDATES[@]}"; do echo "  $u"; done

      - name: 缓存源码包
        id: src-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.qt-src-cache
          key: qt-src-${{ inputs.source_package }}-${{ inputs.qt_version }}

      - name: 下载源码
        id: download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .qt-src-cache

          CACHE=""
          # 候选 URL 中可能包含两种命名，逐个尝试，命中即用其文件名作为缓存名
          while IFS= read -r URL; do
            [[ -z "$URL" ]] && continue
            CAND_NAME="$(basename "$URL")"
            CAND_CACHE=".qt-src-cache/$CAND_NAME"

            if [[ -f "$CAND_CACHE" ]]; then
              echo "命中缓存: $CAND_CACHE ($(du -h "$CAND_CACHE" | cut -f1))"
              CACHE="$CAND_CACHE"
              break
            fi

            echo "尝试: $URL"
            if curl -fL --retry 3 --connect-timeout 30 -o "$CAND_CACHE.part" "$URL"; then
              mv "$CAND_CACHE.part" "$CAND_CACHE"
              echo "下载成功: $CAND_NAME ($(du -h "$CAND_CACHE" | cut -f1))"
              CACHE="$CAND_CACHE"
              break
            fi
            rm -f "$CAND_CACHE.part"
            echo "  -> 该地址不可用，尝试下一个"
          done <<< "${{ steps.src.outputs.urls }}"

          if [[ -z "$CACHE" ]]; then
            echo "::error::所有候选地址均下载失败。请确认版本 ${{ inputs.qt_version }} 是否存在，或该版本是否在镜像上可用。"
            exit 1
          fi

          echo "解包中: $CACHE"
          mkdir -p qt-src
          tar -xJf "$CACHE" -C qt-src
          echo "解包结果:"
          ls -d qt-src/*/

          # 自动探测真实解包目录名（命名规则不统一，不能靠猜）
          # 用 find -print -quit 代替 `find | head`，从根上避免 SIGPIPE/141
          REAL_DIR="$(find qt-src -maxdepth 1 -mindepth 1 -type d -print -quit)"
          if [[ -z "$REAL_DIR" ]]; then
            echo "::error::解包后未找到任何目录"
            exit 1
          fi
          REAL_DIR_NAME="$(basename "$REAL_DIR")"
          echo "解包目录名: $REAL_DIR_NAME"
          echo "pkg_dir=$REAL_DIR_NAME" >> $GITHUB_OUTPUT

      # =======================================================================
      # 4.5 源码补丁：qtscript 在 -ltcg(-flto) 下的链接失败
      #     Qt 官方 bug QTBUG-42989（标记为「不修」）。cti_vm_throw 等函数由
      #     全局内联汇编写成、只被汇编引用，LTO 会当作死代码丢弃 →
      #     「undefined reference to cti_vm_throw」。
      #     业界做法：给声明加 __attribute__((used)) 强制保留符号。
      #     仅在启用了 -ltcg 且源码包含 qtscript 时才实际改动（脚本内自动判定）。
      # =======================================================================
      - name: 打补丁 qtscript LTO (Linux/macOS)
        id: patch-qtscript
        if: inputs.os != 'windows'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/patch-qtscript-lto.sh "${{ steps.download.outputs.pkg_dir }}"

      # =======================================================================
      # 4.6 探测 Windows 三方依赖（OpenSSL / PostgreSQL）
      #     Qt6 走 CMake，FindOpenSSL/FindPostgreSQL 会自动找到 runner 上预装的
      #     C:\Program Files\OpenSSL 与 C:\Program Files\PostgreSQL\<ver>。
      #     但 Qt5 走 qmake 体系，只认编译器全局搜索路径，不会自动去找，
      #     于是 configure 报 "openssl/ssl.h not found in [] and global paths."
      #     并最终失败（run 38375939083），PostgreSQL 则静默变成 no。
      #     这里在编译前把两者的 prefix 探测出来，交给下一步生成 Qt5 专用参数。
      # =======================================================================
      - name: 探测 Windows 三方依赖 (OpenSSL/PostgreSQL)
        id: deps-win
        if: inputs.os == 'windows'
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/detect-win-deps.ps1

      # =======================================================================
      # 5. 生成 configure 参数
      # =======================================================================
      - name: 生成 configure 参数 (Linux/macOS)
        id: genargs-unix
        if: inputs.os != 'windows'
        shell: bash
        run: |
          export QT_PREFIX="$RUNNER_TEMP/qtinstall/${{ inputs.qt_version }}-${{ inputs.compiler }}-${{ inputs.build_type }}"
          bash .github/scripts/gen-configure-args.sh

      - name: 生成 configure 参数 (Windows)
        id: genargs-win
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          QT_OPENSSL_INCDIR: ${{ steps.deps-win.outputs.openssl_incdir }}
          QT_OPENSSL_LIBDIR: ${{ steps.deps-win.outputs.openssl_libdir }}
          QT_PSQL_INCDIR: ${{ steps.deps-win.outputs.psql_incdir }}
          QT_PSQL_LIBDIR: ${{ steps.deps-win.outputs.psql_libdir }}
        run: |
          $env:QT_PREFIX = "$env:RUNNER_TEMP\qtinstall\${{ inputs.qt_version }}-${{ inputs.compiler }}-${{ inputs.build_type }}"
          pwsh -NoProfile -File .github/scripts/gen-configure-args.ps1

      # =======================================================================
      # 6. 编译
      # =======================================================================
      - name: ccache 缓存恢复 (Linux/macOS)
        if: ${{ inputs.os != 'windows' && inputs.use_ccache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.qt_version }}-${{ inputs.linux_flavor }}-wl${{ inputs.enable_wayland }}-png${{ inputs.use_system_png }}-${{ hashFiles('.github/scripts/*') }}
          restore-keys: |
            ccache-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.qt_version }}-
            ccache-${{ inputs.os }}-${{ inputs.compiler }}-

      - name: 编译 (Linux/macOS)
        id: build
        if: inputs.os != 'windows'
        shell: bash
        env:
          QT_SRC_DIR: ${{ github.workspace }}/qt-src/${{ steps.download.outputs.pkg_dir }}
          QT_BUILD_DIR: ${{ github.workspace }}/build
          QT_CONFIGURE_ARGS: ${{ steps.genargs-unix.outputs.configure_args }}
          QT_PREFIX: ${{ steps.genargs-unix.outputs.prefix }}
          QT_MAJOR: ${{ inputs.qt_major }}
          QT_PLATFORM: ${{ inputs.os }}-${{ inputs.compiler }}
          QT_LINUX_FLAVOR: ${{ inputs.linux_flavor }}
          QT_ENABLE_WAYLAND: ${{ inputs.enable_wayland }}
          QT_SOURCE_PACKAGE: ${{ inputs.source_package }}
          QT_SKIP_MODULES: ${{ inputs.skip_modules }}
        run: |
          # 老系统容器内需要先启用 gcc-toolset（等价 CentOS7 的 devtoolset）
          if [[ "${{ inputs.use_container }}" == "true" ]]; then
            echo "启用 ${{ inputs.devtoolset }} ..."
            scl enable ${{ inputs.devtoolset }} -- bash .github/scripts/build-qt.sh
          else
            bash .github/scripts/build-qt.sh
          fi

      - name: 编译 (Windows)
        id: build-win
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          QT_SRC_DIR: ${{ github.workspace }}\qt-src\${{ steps.download.outputs.pkg_dir }}
          QT_BUILD_DIR: ${{ github.workspace }}\build
          QT_CONFIGURE_ARGS: ${{ steps.genargs-win.outputs.configure_args }}
          QT_PREFIX: ${{ steps.genargs-win.outputs.prefix }}
        run: |
          pwsh -NoProfile -File .github/scripts/build-qt.ps1

      - name: ccache 统计 (Linux/macOS)
        if: ${{ inputs.os != 'windows' && inputs.use_ccache && always() }}
        shell: bash
        run: ccache --show-stats || true

      # =======================================================================
      # 7. 打包
      # =======================================================================
      - name: 计算产物名
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          # 平台后缀，老系统容器线加上 glibc 标识
          SUFFIX="${{ inputs.compiler }}"
          if [[ "${{ inputs.os }}" == "linux" && "${{ inputs.use_container }}" == "true" ]]; then
            SUFFIX="${SUFFIX}-glibc228"
          fi
          if [[ "${{ inputs.os }}" == "linux" && "${{ inputs.qt_major }}" == "5" ]]; then
            # 区分 Linux Qt5 老系统线 / 新系统线
            if [[ "${{ inputs.use_container }}" == "true" || "${{ inputs.linux_flavor }}" == "legacy" ]]; then
              SUFFIX="${SUFFIX}-legacy"
            else
              SUFFIX="${SUFFIX}-modern"
            fi
          fi
          if [[ "${{ inputs.arch }}" == "arm64" ]]; then
            SUFFIX="${SUFFIX}-arm64"
          fi
          if [[ "${{ inputs.static_build }}" == "true" ]]; then
            SUFFIX="${SUFFIX}-static"
          fi
          NAME="Qt-${{ inputs.qt_version }}-${{ inputs.os }}-${SUFFIX}-${{ inputs.build_type }}"
          echo "artifact_name=$NAME" >> $GITHUB_OUTPUT
          echo "产物名: $NAME"

      - name: 打包 (Linux/macOS)
        id: pkg-unix
        if: inputs.os != 'windows'
        shell: bash
        env:
          QT_PREFIX: ${{ steps.genargs-unix.outputs.prefix }}
          QT_VERSION: ${{ inputs.qt_version }}
          QT_PLATFORM: ${{ inputs.os }}-${{ inputs.compiler }}
          QT_BUILD_TYPE: ${{ inputs.build_type }}
          QT_SOURCE_PACKAGE: ${{ inputs.source_package }}
          QT_PACK_MODE: ${{ inputs.pack_mode }}
          QT_OUTPUT_DIR: ${{ github.workspace }}/dist
          QT_ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          QT_CONFIGURE_ARGS: ${{ steps.genargs-unix.outputs.configure_args }}
          QT_BUILD_SECONDS: ${{ steps.build.outputs.build_seconds || '0' }}
          QT_LINUX_FLAVOR: ${{ inputs.linux_flavor }}
          QT_ENABLE_WAYLAND: ${{ inputs.enable_wayland }}
        run: bash .github/scripts/package-qt.sh

      - name: 打包 (Windows)
        id: pkg-win
        if: inputs.os == 'windows'
        shell: pwsh
        env:
          QT_PREFIX: ${{ steps.genargs-win.outputs.prefix }}
          QT_VERSION: ${{ inputs.qt_version }}
          QT_PLATFORM: ${{ inputs.os }}-${{ inputs.compiler }}
          QT_BUILD_TYPE: ${{ inputs.build_type }}
          QT_SOURCE_PACKAGE: ${{ inputs.source_package }}
          QT_PACK_MODE: ${{ inputs.pack_mode }}
          QT_OUTPUT_DIR: ${{ github.workspace }}\dist
          QT_ARTIFACT_NAME: ${{ steps.meta.outputs.artifact_name }}
          QT_CONFIGURE_ARGS: ${{ steps.genargs-win.outputs.configure_args }}
          QT_BUILD_SECONDS: ${{ steps.build-win.outputs.build_seconds || '0' }}
          # 三方运行库 DLL 目录：由「探测 Windows 三方依赖」步骤提供，
          # 打包时收进产物 3rdparty/，让产物自带 OpenSSL / PostgreSQL 运行库。
          QT_OPENSSL_BINDIR: ${{ steps.deps-win.outputs.openssl_bindir }}
          QT_PSQL_BINDIR: ${{ steps.deps-win.outputs.psql_bindir }}
        run: |
          pwsh -NoProfile -File .github/scripts/package-qt.ps1

      # =======================================================================
      # 8. 上传构建产物（Actions artifact，永久保留 90 天，作为 Release 之外的备份）
      # =======================================================================
      - name: 上传 Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/BUILD-INFO.txt
          retention-days: 30
          compression-level: 0   # 已经是压缩包，不再二次压缩

      # =======================================================================
      # 9. 发布到 Release
      # =======================================================================
      - name: 生成 Release Tag
        id: tag
        if: inputs.create_release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ inputs.release_tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="qt${{ inputs.qt_major }}-${{ inputs.qt_version }}-${{ inputs.os }}-${{ inputs.compiler }}-${{ inputs.build_type }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG"

      - name: 发布 Release
        if: inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Qt ${{ inputs.qt_version }} (${{ inputs.os }}/${{ inputs.compiler }}/${{ inputs.build_type }})"
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: false
          body: |
            ## Qt ${{ inputs.qt_version }} 编译产物

            | 项目 | 值 |
            |---|---|
            | 版本 | ${{ inputs.qt_version }} |
            | 目标系统 | ${{ inputs.os }} |
            | 编译器 | ${{ inputs.compiler }} |
            | 架构 | ${{ inputs.arch }} |
            | 构建类型 | ${{ inputs.build_type }} |
            | 源码粒度 | ${{ inputs.source_package }} |
            | 静态构建 | ${{ inputs.static_build }} |
            | 打包模式 | ${{ inputs.pack_mode }} |
            | 跳过模块 | ${{ inputs.skip_modules }} |
            | Linux 线 | ${{ inputs.os == 'linux' && inputs.linux_flavor || '-' }} |
            | Wayland | ${{ inputs.os == 'linux' && inputs.enable_wayland || '-' }} |
            | 系统 libpng | ${{ inputs.os == 'linux' && inputs.use_system_png || '-' }} |

            **configure 参数**
            ```
            ${{ steps.genargs-unix.outputs.configure_args }}${{ steps.genargs-win.outputs.configure_args }}
            ```

            构建工作流: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          files: |
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/BUILD-INFO.txt
          fail_on_unmatched_files: false
          make_latest: false

      # =======================================================================
      # 10. 最终摘要
      # =======================================================================
      - name: 构建摘要
        if: always()
        shell: bash
        run: |
          {
            echo "## Qt ${{ inputs.qt_version }} 编译完成"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 产物名 | \`${{ steps.meta.outputs.artifact_name }}\` |"
            echo "| 平台 | ${{ inputs.os }} / ${{ inputs.compiler }} |"
            echo "| 构建类型 | ${{ inputs.build_type }} |"
            echo "| 编译耗时 | ${{ steps.build.outputs.build_seconds || steps.build-win.outputs.build_seconds || 0 }} 秒 |"
            echo "| Release | ${{ inputs.create_release }} (\`${{ steps.tag.outputs.tag }}\`) |"
          } >> $GITHUB_STEP_SUMMARY