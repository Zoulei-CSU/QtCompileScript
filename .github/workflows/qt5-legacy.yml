# =============================================================================
# qt5-legacy.yml —— Qt5 老系统线（AlmaLinux 8 / glibc 2.28）
#
# 使用场景：
#   需要产物能在较老的 glibc（2.28）系统上运行，覆盖
#     Debian 10+ / Ubuntu 18.10+ / Fedora 29+ / RHEL 8+ / CentOS 8+ 等。
#   直接在 ubuntu-22.04 上编译出来的 Qt 依赖 glibc 2.35+，兼容面更窄。
#   本线用 almalinux:8 容器 + gcc-toolset 编译，保证 glibc 2.28 兼容。
#
# ⚠️ 为什么不再用 CentOS7（glibc 2.17）：
#   GitHub Actions 已把 Node20-based action 强制跑在 Node.js 24 上，
#   而 Node 24 要求 glibc >= 2.27/2.28。CentOS7 只有 glibc 2.17，
#   导致 actions/checkout、actions/cache、actions/upload-artifact 等
#   所有 Node-based action 在容器内直接起不来（CXXABI/GLIBC not found）。
#   该组合无解（Node 官方无 glibc-217 的 Node 24 构建），业界（PyTorch/
#   NumPy/manylinux）均已放弃 CentOS7/AL2，改用 glibc 2.28 基础镜像。
#   故本线基线从 glibc 2.17 上移到 2.28。
#
# 本线固定策略（均为老系统硬约束）：
#   - 源码包：qt-everywhere（全量，含 qtwayland 模块但被 skip）
#   - Wayland：关闭（保持最大兼容；AlmaLinux 8 虽有 libwayland-devel 但不启用）
#   - libpng：源码内置（-qt-libpng）
#   - iconv：启用；ICU：关闭（-iconv -no-icu）
#   - 始终启用：openssl-linked / libpq(psql) / fontconfig / xcb / opengl desktop
#   - 输出：strip + tar.xz
#
# 注意：
#   - 容器内编译无法用 Actions Cache 的 ccache（路径隔离），故 ccache 默认关闭
#   - 本线只编译 Qt5（Qt6 老系统线尚未启用，需单独验证 gcc-toolset 组合）
# =============================================================================
name: Qt5 Build (Legacy / AlmaLinux8 glibc2.28)

on:
  workflow_dispatch:
    inputs:
      qt_version:
        description: "Qt5 版本"
        required: true
        type: choice
        default: "5.15.17"
        options:
          - "5.15.19"
          - "5.15.18"
          - "5.15.17"
          - "5.15.16"
          - "5.15.2"

      devtoolset:
        description: "GCC toolset 版本（决定 GCC 版本）"
        required: true
        type: choice
        default: "gcc-toolset-11"
        options:
          - "gcc-toolset-9"
          - "gcc-toolset-10"
          - "gcc-toolset-11"
          - "gcc-toolset-12"
          - "gcc-toolset-13"

      arch:
        description: "目标架构"
        required: true
        type: choice
        default: "x86_64"
        options:
          - x86_64

      build_type:
        description: "构建类型（debug 耗时 2-3 倍，有超时/超体积风险）"
        required: true
        type: choice
        default: "release"
        options:
          - release
          - debug
          - debug-and-release

      skip_modules:
        description: "跳过的模块（逗号分隔；qtwayland 会被自动加入）"
        required: false
        type: string
        default: "qtdoc,qt3d,qtwebengine,qtwebview"

      extra_configure_args:
        description: "追加 configure 参数（高级，可留空）"
        required: false
        type: string
        default: ""

      sql_drivers:
        description: "额外 SQL 驱动（逗号分隔，如 oci；psql 始终启用）"
        required: false
        type: string
        default: ""

      static_build:
        description: "静态构建（体积大，注意 LGPL 合规）"
        required: false
        type: boolean
        default: false

      pack_mode:
        description: "打包模式（dev-lite 剔除 doc/examples 源码；dev-full 原样打包）"
        required: true
        type: choice
        default: "dev-lite"
        options:
          - dev-lite
          - dev-full

      create_release:
        description: "创建/更新 Release"
        required: false
        type: boolean
        default: true

      prerelease:
        description: "标记为预发布"
        required: false
        type: boolean
        default: false

      release_tag:
        description: "Release tag（留空自动生成）"
        required: false
        type: string
        default: ""

# -----------------------------------------------------------------------------
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      qt_major: "5"
      qt_version: ${{ inputs.qt_version }}
      # 平台标识用 linux-almalinux8-<toolset>，便于后缀命名与参数生成分支识别
      os: "linux"
      compiler: "almalinux8-${{ inputs.devtoolset }}"
      arch: ${{ inputs.arch }}
      build_type: ${{ inputs.build_type }}
      # 全量 qt-everywhere
      source_package: "qt-everywhere"
      static_build: ${{ inputs.static_build }}
      skip_modules: ${{ inputs.skip_modules }}
      extra_configure_args: ${{ inputs.extra_configure_args }}
      openssl_linked: true
      sql_drivers: ${{ inputs.sql_drivers }}
      # 容器内 ccache 缓存无法跨运行复用，默认关闭
      use_ccache: false
      # 老系统线固定：legacy / 关闭 Wayland / 不用系统 libpng（用内置）
      linux_flavor: "legacy"
      enable_wayland: false
      use_system_png: false
      pack_mode: ${{ inputs.pack_mode }}
      create_release: ${{ inputs.create_release }}
      release_tag: ${{ inputs.release_tag }}
      prerelease: ${{ inputs.prerelease }}
      use_container: true
      container_image: "almalinux:8"
      devtoolset: ${{ inputs.devtoolset }}
      timeout_minutes: 350